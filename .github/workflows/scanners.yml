name: Leaked Secrets Scan With Trufflehog
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  TruffleHog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@2caa45cf2210ad5660671fcd4c6a8eb6eb98a96b # main
        with:
          path: ./
          base: experiment-bed
          head: HEAD
          extra_args: --debug --only-verified
